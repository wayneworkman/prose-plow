# The JDK that runs Gradle is deliberately NOT set here. org.gradle.java.home is an absolute
# path: committed, it breaks every other machine and F-Droid's build server. Gradle takes the
# JDK from JAVA_HOME instead, which env.sh exports (Temurin 21); source it before ./gradlew.

# This is a shared inference box: keep the build gentle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=4

# Every library is an AndroidX one; there are no legacy support libraries to translate.
android.useAndroidX=true

# Never let AGP silently download SDK packages; install them explicitly with sdkmanager.
android.builder.sdkDownload=false
